<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paço do Bispo Boutique House · Sintra</title>
    <meta name="description" content="Boutique house de luxo na reserva natural de Sintra. Nove quartos, estúdio e penthouse, piscina panorâmica e lounge na antiga capela." />
    <meta name="author" content="Paço do Bispo Boutique House" />

    <!-- Preconnect to font hosts for faster critical font delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload the hero LCP poster -->
    <link
      rel="preload"
      as="image"
      href="/__l5e/assets-v1/637768af-5205-47ec-8fb4-6384a8e23fcf/hero-paco.jpg"
      fetchpriority="high"
    />

    <!--
      Critical fonts: load the Google Fonts CSS asynchronously so it doesn't
      render-block. `preload as=style` warms the connection, `onload` promotes
      it to a real stylesheet, and the <noscript> tag is the JS-off fallback.
      `display=swap` is set on the URL to render fallback fonts immediately.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
      fetchpriority="high"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      />
    </noscript>


    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png?v=4" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />

    <meta property="og:title" content="Paço do Bispo Boutique House · Sintra" />
    <meta property="og:description" content="Tradição, paisagem e silêncio no coração da serra de Sintra." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Critical CSS: inlined so the hero paints before Tailwind's stylesheet arrives. -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;line-height:1.5}
      body{
        font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        color:hsl(20 18% 14%);
        background:hsl(20 22% 12%); /* matches hero dark base — avoids white flash */
        -webkit-font-smoothing:antialiased;
        text-rendering:optimizeLegibility;
      }
      img,video{display:block;max-width:100%;height:auto}
      #root{min-height:100vh}
      /* Hero shell — mirrors Tailwind classes used by <Hero /> for first paint */
      .hero-shell{position:relative;height:100vh;min-height:640px;width:100%;overflow:hidden}
      .hero-media{position:absolute;inset:0}
      .hero-media > img,.hero-media > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .hero-overlay{
        position:absolute;inset:0;
        background:linear-gradient(180deg,hsl(20 22% 12% / 0.25) 0%,hsl(20 22% 12% / 0.7) 45%,hsl(20 22% 12% / 0.95) 100%);
      }
      .hero-serif{font-family:'Cormorant Garamond',ui-serif,Georgia,'Times New Roman',serif;font-weight:400}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
